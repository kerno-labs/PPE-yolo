[project]
name = "ppe-yolo-ml"
version = "0.1.0"
description = "YOLO26n 3-class PPE helmet detection training & ESP-DL quantization pipeline for M5Stack CoreS3"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4.0,<2.7.0",
    "torchvision>=0.19.0,<0.22.0",
    "numpy<2.0.0",
    "ultralytics==8.4.7",
    "esp-ppq==1.2.4",
    "onnx==1.17.0",
    "onnxruntime>=1.19.0",
    "onnxslim>=0.1.34",
    "opencv-python>=4.10.0,<4.12.0",
    "pillow>=10.4.0",
    "pyyaml>=6.0.2",
    "matplotlib>=3.9.0",
    "ninja>=1.11.1",
]
